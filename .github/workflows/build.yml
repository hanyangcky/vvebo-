name: Build vvebo_fix dylib

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
      - name: Build dylib
        run: |
          cd vvebo_fix
          make
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vvebo_fix.dylib
          path: vvebo_fix/vvebo_fix.dylib
